# i3blocks config file
#
# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks
#
# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
separator_block_width=15

[disk-root]
instance=/
command=~/.config/i3blocks/scripts/disk.sh
interval=300

[disk-var]
instance=/var
command=~/.config/i3blocks/scripts/disk.sh
interval=300

[disk-home]
instance=/home
command=~/.config/i3blocks/scripts/disk.sh
interval=300

[wifi]
command=~/.config/i3blocks/scripts/wifi.sh
interval=60

[network]
command=~/.config/i3blocks/scripts/net.sh
interval=60

[load]
command=~/.config/i3blocks/scripts/load_average.sh
interval=30

[memory]
command=~/.config/i3blocks/scripts/memory.sh
interval=30

[volume]
command=~/.config/i3blocks/scripts/volume.sh
interval=120
signal=10

[brightness]
command=~/.config/i3blocks/scripts/brightness.sh
interval=120
signal=11

[battery]
command=~/.config/i3blocks/scripts/battery.sh
interval=30

[time]
command=date +'%a %b %d  %H:%M %Z'
interval=30
